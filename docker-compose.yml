version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pedidos_postgres
    environment:
      POSTGRES_USER: user_pedidos
      POSTGRES_PASSWORD: password_pedidos
      POSTGRES_DB: db_pedidos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pedidos_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: